name: Build

on:
  push:
    branches: [main, develop] # TODO: add custom name for debug branches
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.sdk }}/${{ matrix.build_type }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        sdk:
          # - Adobe_Illustrator_2022_SDK_22_07_v4
          # - Adobe_Illustrator_2023_SDK_23_08_v1
          # - Adobe_Illustrator_2024_SDK_24_09_v1
          # - Adobe_Illustrator_2025_SDK_25_08_v1
          # - Adobe_Illustrator_2026_SDK_26_08_v1
          - Adobe_Illustrator_2027_SDK_27_11_v1
        # On main branch, only build release.
        build_type: ${{ fromJSON(github.ref == 'refs/heads/main' && '["release"]' || '["release","debug"]') }}

    env:
      OS_SHORT: ${{ matrix.os == 'windows-latest' && 'win' || 'mac' }}
      BUILD_CONFIG: ${{ matrix.build_type == 'release' && 'Release' || 'Debug' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Set up SSH key for SDK repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_SDK_REPO }}

      - name: Clone SDK repo
        run: |
          git clone git@github.com:LaTeX2AI/adobe-illustrator-sdk-private.git ai_sdk

      - name: Checkout LaTeX2AI repo
        uses: actions/checkout@v7
        with:
          path: latex2ai

      - name: Configure LaTeX2AI
        run: >
          cmake -S latex2ai -B build -DCMAKE_BUILD_TYPE=$BUILD_CONFIG "-DAI_SDK_DIR=$GITHUB_WORKSPACE/ai_sdk/${{ matrix.sdk }}_$OS_SHORT" ${{ runner.os == 'macOS' && '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"' || '' }} #magic___^_^___line
      - name: Build LaTeX2AI
        run: cmake --build build --config $BUILD_CONFIG --parallel

      - name: Collect plug-in
        run: |
          # The file name here is parsed by scripts/create_release.py in the release job
          mkdir -p release_files
          mv "build/$BUILD_CONFIG/LaTeX2AI.aip" \
             "release_files/LaTeX2AI.${GITHUB_SHA::7}.${{ matrix.sdk }}.$OS_SHORT.${{ matrix.build_type }}.aip"

      - name: Upload executable as artifact
        uses: actions/upload-artifact@v7
        with:
          name: build_${{ matrix.sdk }}_${{ env.OS_SHORT }}_${{ matrix.build_type }}
          path: release_files

  release:
    name: Combine plugin and signed UI
    runs-on: macos-latest

    needs: build # depends on all matrix builds finishing

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Checkout LaTeX2AI repo
        uses: actions/checkout@v7

      - name: Create output directory
        run: |
          mkdir -p gathered_artifacts
          mkdir -p final_release_files

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: gathered_artifacts
          merge-multiple: true # Combines all named artifacts into one folder

      - name: Sign UI folder and create container
        run: |
          echo 'export LATEX2AI_CERTIFICATE_PASSWORD="${{ secrets.LATEX2AI_CERTIFICATE_PASSWORD }}"' > scripts/ui_signing/SET_KEY.sh
          chmod +x scripts/ui_signing/SET_KEY.sh
          echo "${{ secrets.LATEX2AI_P12_BASE64 }}" | base64 --decode > scripts/ui_signing/latex2ai_certificate.p12
          python scripts/create_headers.py
          python scripts/create_release.py

      - name: Upload the created container
        uses: actions/upload-artifact@v7
        with:
          name: LaTeX2AI_installation_files
          path: final_release_files

      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: "build_*"
          failOnError: false
